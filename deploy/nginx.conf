# This host is deliberately separate from the existing websites.
# After DNS resolves, certbot --nginx adds TLS for this host only.
server {
    listen 80;
    listen [::]:80;
    server_name maicoach.harveypacleb.com;
    include /etc/nginx/snippets/maicoach-cloudflare-realip.conf;
    client_max_body_size 2m;
    access_log /var/log/nginx/maicoach.access.log;
    error_log /var/log/nginx/maicoach.error.log;
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    location /.well-known/acme-challenge/ {
        root /var/www/maicoach/acme;
    }

    location / {
        proxy_pass http://127.0.0.1:3107;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Replace, rather than append, client-supplied forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
    }
}
